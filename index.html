<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>石头导航</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>">
  <link rel="stylesheet" href="style.css">
  <style>
    /* 管理悬浮按钮 & 弹窗样式 */
    .admin-float-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 999;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #3b82f6;
      color: #fff;
      font-size: 24px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .admin-float-btn:hover {
      transform: scale(1.08);
      background: #2563eb;
    }
    .admin-modal-mask {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(4px);
      z-index: 10000;
      justify-content: center;
      align-items: center;
    }
    .admin-modal-card {
      background: #1c1c28;
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      padding: 22px;
      border-radius: 14px;
      width: 90%;
      max-width: 350px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      box-sizing: border-box;
    }
    .admin-modal-card h3 {
      margin: 0 0 14px 0;
      font-size: 17px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .admin-modal-card label {
      font-size: 12px;
      color: #aaa;
      display: block;
      margin-bottom: 4px;
    }
    .admin-modal-card input {
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #272738;
      color: #fff;
      box-sizing: border-box;
      outline: none;
    }
    .admin-modal-card input:focus {
      border-color: #3b82f6;
    }
    .admin-btn-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
    }
    .admin-action-btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-save { background: #22c55e; color: #fff; }
    .btn-cancel { background: #374151; color: #fff; }
    /* 卡片删除按钮 */
    .delete-card-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      background: #ef4444;
      color: #fff;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      z-index: 10;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .delete-mode .delete-card-badge {
      display: flex !important;
    }
  </style>
</head>
<body>
<div id="bgLayer"></div>
<div id="bgOverlay"></div>
<div class="container">
  <!-- 头部 -->
  <div class="header-area">
    <span class="header-icon">🧭</span>
    <div>
      <h1>石头导航</h1>
      <p class="header-subtitle">沉舟侧畔千帆过，病树前头万木春。</p>
    </div>
    <span class="header-icon">✦</span>
  </div>
  <!-- 搜索区域 -->
  <div class="search-wrapper">
    <!-- 分类 Tab -->
    <div class="search-tabs" id="searchTabs"></div>
    <!-- 搜索框 -->
    <div class="search-box">
      <button class="engine-trigger" id="engineTrigger" aria-label="切换搜索引擎">
        <img id="search-engine-icon" src="" alt="搜索引擎图标">
        <span class="engine-name" id="engineName"></span>
        <span class="engine-arrow" id="engineArrow">▾</span>
      </button>
      <div class="search-divider"></div>
      <input type="text" id="searchInput" placeholder="搜索网页 / 定位站内网站" autocomplete="off" oninput="filterLinks()" />
      <button class="clear-btn" id="clearBtn" aria-label="清空" style="display:none;" onclick="clearSearch()">✕</button>
      <button class="search-submit-btn" onclick="doSearch()" aria-label="搜索">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
    </div>
    <!-- 内联引擎面板 -->
    <div class="engine-list" id="enginePanel" style="display:none;"></div>
  </div>

  <!-- 链接分区（由 main.js 动态渲染） -->
  <div id="main-content"></div>
</div>

<!-- 浮动管理按钮 -->
<button class="admin-float-btn" id="adminBtn" title="管理/添加网址">+</button>

<!-- 管理弹窗 -->
<div class="admin-modal-mask" id="adminModal">
  <div class="admin-modal-card">
    <h3>
      <span>➕ 添加网址</span>
      <button id="toggleDeleteModeBtn" style="background: none; border: 1px solid #ef4444; color: #ef4444; border-radius: 6px; padding: 2px 8px; font-size: 11px; cursor: pointer;">🗑️ 删除模式</button>
    </h3>
    
    <div id="pwdContainer">
      <label style="color:#f87171;">🔑 管理密码 (仅需输入一次):</label>
      <input type="password" id="adminPasswordInput" placeholder="输入你在 CF 设置的密码">
    </div>

    <label>分类名称:</label>
    <input type="text" id="addSection" placeholder="例如：常用 / 游戏机">
    
    <label>网站名称:</label>
    <input type="text" id="addTitle" placeholder="例如：YouTube">
    
    <label>外网链接 (URL):</label>
    <input type="text" id="addUrl" placeholder="https://...">

    <label>内网链接 (可选):</label>
    <input type="text" id="addIntranet" placeholder="http://192.168.x.x (选填)">
    
    <label>网站描述 (可选):</label>
    <input type="text" id="addDesc" placeholder="例如：视频平台">
    
    <div class="admin-btn-group">
      <span id="resetPwdBtn" style="font-size: 12px; color: #888; cursor: pointer; text-decoration: underline;">重设密码</span>
      <div>
        <button class="admin-action-btn btn-cancel" id="closeModalBtn">取消</button>
        <button class="admin-action-btn btn-save" id="saveLinkBtn">保存并发布</button>
      </div>
    </div>
  </div>
</div>

<script src="main.js"></script>
</body>
</html>
