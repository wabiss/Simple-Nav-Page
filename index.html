<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>石头导航</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>">
  <link rel="stylesheet" href="style.css">
  <style>
    /* ⚙️ 齿轮悬浮按钮 */
    .admin-float-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 999;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #3b82f6;
      color: #fff;
      font-size: 20px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
    }
    .admin-float-btn:hover {
      transform: rotate(60deg) scale(1.08);
      background: #2563eb;
    }

    /* 弹窗遮罩与主卡片 */
    .admin-modal-mask {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(6px);
      z-index: 10000;
      justify-content: center;
      align-items: center;
    }
    .admin-modal-card {
      background: #1e1e2d;
      border: 1px solid rgba(255,255,255,0.12);
      color: #fff;
      padding: 22px;
      border-radius: 14px;
      width: 90%;
      max-width: 360px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.6);
      box-sizing: border-box;
      animation: modalFadeIn 0.2s ease-out;
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .admin-modal-card h3 {
      margin: 0 0 16px 0;
      font-size: 17px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 10px;
    }
    .admin-modal-card label {
      font-size: 12px;
      color: #aaa;
      display: block;
      margin-bottom: 4px;
    }
    .admin-modal-card input {
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #38384f;
      background: #28283c;
      color: #fff;
      box-sizing: border-box;
      outline: none;
    }
    .admin-modal-card input:focus {
      border-color: #3b82f6;
    }
    .admin-btn-group {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 10px;
    }
    .admin-action-btn {
      padding: 7px 15px;
      border-radius: 7px;
      border: none;
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
    }
    .btn-save { background: #22c55e; color: #fff; }
    .btn-cancel { background: #374151; color: #fff; }
    .btn-lock { background: #ef4444; color: #fff; }

    /* 删除卡片小红叉 */
    .delete-card-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      background: #ef4444;
      color: #fff;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      z-index: 10;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .delete-mode .delete-card-badge {
      display: flex !important;
    }
  </style>
</head>
<body>
<div id="bgLayer"></div>
<div id="bgOverlay"></div>
<div class="container">
  <!-- 头部 -->
  <div class="header-area">
    <span class="header-icon">🧭</span>
    <div>
      <h1>石头导航</h1>
      <p class="header-subtitle">沉舟侧畔千帆过，病树前头万木春。</p>
    </div>
    <span class="header-icon">✦</span>
  </div>
  <!-- 搜索区域 -->
  <div class="search-wrapper">
    <!-- 分类 Tab -->
    <div class="search-tabs" id="searchTabs"></div>
    <!-- 搜索框 -->
    <div class="search-box">
      <button class="engine-trigger" id="engineTrigger" aria-label="切换搜索引擎">
        <img id="search-engine-icon" src="" alt="搜索引擎图标">
        <span class="engine-name" id="engineName"></span>
        <span class="engine-arrow" id="engineArrow">▾</span>
      </button>
      <div class="search-divider"></div>
      <input type="text" id="searchInput" placeholder="搜索网页 / 定位站内网站" autocomplete="off" oninput="filterLinks()" />
      <button class="clear-btn" id="clearBtn" aria-label="清空" style="display:none;" onclick="clearSearch()">✕</button>
      <button class="search-submit-btn" onclick="doSearch()" aria-label="搜索">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
    </div>
    <!-- 内联引擎面板 -->
    <div class="engine-list" id="enginePanel" style="display:none;"></div>
  </div>

  <!-- 链接分区（由 main.js 动态渲染） -->
  <div id="main-content"></div>
</div>

<!-- ⚙️ 齿轮悬浮按钮 -->
<button class="admin-float-btn" id="adminBtn" onclick="openAdminPanel()" title="网站管理设置">⚙️</button>

<!-- 统一管理弹窗 -->
<div class="admin-modal-mask" id="adminModal">
  
  <!-- 1. 密码解锁界面 -->
  <div class="admin-modal-card" id="lockView" style="display: block;">
    <h3><span>🔐 管理员验证</span></h3>
    <p style="font-size: 12px; color: #888; margin: -6px 0 14px 0;">请输入管理密码，验证成功后此设备将免密登录：</p>
    
    <label>管理密码:</label>
    <input type="password" id="authPasswordInput" placeholder="输入在 Cloudflare 设置的密码" onkeydown="if(event.key==='Enter') verifyAndUnlock()">
    
    <div class="admin-btn-group">
      <button class="admin-action-btn btn-cancel" onclick="closeAdminPanel()">取消</button>
      <button class="admin-action-btn btn-save" id="unlockBtn" onclick="verifyAndUnlock()">确认解锁</button>
    </div>
  </div>

  <!-- 2. 后台管理界面 -->
  <div class="admin-modal-card" id="dashboardView" style="display: none;">
    <h3>
      <span>🛠️ 网站管理后台</span>
      <button id="toggleDeleteBtn" onclick="toggleDeleteMode()" style="background: none; border: 1px solid #ef4444; color: #ef4444; border-radius: 6px; padding: 2px 8px; font-size: 11px; cursor: pointer;">🗑️ 开启删除模式</button>
    </h3>
    
    <label>分类名称:</label>
    <input type="text" id="addSection" placeholder="例如：常用 / 游戏机">
    
    <label>网站名称:</label>
    <input type="text" id="addTitle" placeholder="例如：YouTube">
    
    <label>外网链接 (URL):</label>
    <input type="text" id="addUrl" placeholder="https://...">

    <label>内网链接 (可选):</label>
    <input type="text" id="addIntranet" placeholder="http://192.168.x.x (选填)">
    
    <label>网站描述 (可选):</label>
    <input type="text" id="addDesc" placeholder="例如：视频平台">
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
      <span onclick="lockAdminSession()" style="font-size: 12px; color: #ef4444; cursor: pointer; text-decoration: underline;">🚪 退出管理</span>
      <div style="display: flex; gap: 8px;">
        <button class="admin-action-btn btn-cancel" onclick="closeAdminPanel()">关闭</button>
        <button class="admin-action-btn btn-save" id="saveLinkBtn" onclick="submitNewLink()">保存并发布</button>
      </div>
    </div>
  </div>

</div>

<script src="main.js?v=202409"></script>
</body>
</html>
